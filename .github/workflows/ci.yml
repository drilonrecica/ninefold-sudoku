name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/server/go.sum
      - run: test -z "$(gofmt -l apps/server)"
      - run: go vet ./...
        working-directory: apps/server
      - run: go test ./...
        working-directory: apps/server
      - run: go test -race ./...
        working-directory: apps/server
      - run: make puzzles
      - run: go test ./...
        working-directory: contracts/generated/go
      - run: go build -trimpath ./cmd/api
        working-directory: apps/server
      - run: go build -trimpath ./cmd/deployment-config
        working-directory: apps/server

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/server/go.sum
      - run: pnpm install --frozen-lockfile
      - run: make generate
      - run: git diff --exit-code
      - run: pnpm format:check
      - run: pnpm --filter @ninefold/web lint
      - run: pnpm --filter @ninefold/web check
      - run: pnpm --filter @ninefold/web test
      - run: pnpm --filter @ninefold/web build
      - run: pnpm --filter @ninefold/web budget

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '25'
      - run: make tla

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/server/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ninefold/web exec playwright install --with-deps chromium
      - run: make e2e

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/server/go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
        working-directory: apps/server
      - run: pnpm audit --audit-level high
      - name: Generate ephemeral production build inputs
        run: go run ./apps/server/cmd/deployment-config -public-url https://ninefold.recica.dev -version 0.3.1 -output /tmp/ninefold-ci.env
      - name: Validate base and standalone Compose stacks
        run: |
          docker compose --env-file /tmp/ninefold-ci.env -f compose.yaml config --quiet
          docker compose --env-file /tmp/ninefold-ci.env -f compose.yaml -f compose.standalone.yaml config --quiet
      - name: Build production service images
        run: docker compose -p ninefold-ci --env-file /tmp/ninefold-ci.env -f compose.yaml build
      - name: Validate gateway configuration
        run: |
          docker run --rm -e NINEFOLD_PROXY_SECRET=ci-placeholder -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" ninefold-ci-gateway validate --config /etc/caddy/Caddyfile
          docker run --rm -e NINEFOLD_PROXY_SECRET=ci-placeholder -e NINEFOLD_DOMAIN=ninefold.recica.dev -v "$PWD/deploy/Caddyfile.standalone:/etc/caddy/Caddyfile:ro" ninefold-ci-gateway validate --config /etc/caddy/Caddyfile
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image --exit-code 1 --severity HIGH,CRITICAL ninefold-ci-gateway
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image --exit-code 1 --severity HIGH,CRITICAL ninefold-ci-server
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image --exit-code 1 --severity HIGH,CRITICAL ninefold-ci-web
