name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/server/go.sum
      - run: test -z "$(gofmt -l apps/server)"
      - run: go vet ./...
        working-directory: apps/server
      - run: go test ./...
        working-directory: apps/server
      - run: go test -race ./...
        working-directory: apps/server
      - run: make puzzles
      - run: go test ./...
        working-directory: contracts/generated/go
      - run: go build -trimpath ./cmd/api
        working-directory: apps/server

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/server/go.sum
      - run: pnpm install --frozen-lockfile
      - run: make generate
      - run: git diff --exit-code
      - run: pnpm format:check
      - run: pnpm --filter @ninefold/web lint
      - run: pnpm --filter @ninefold/web check
      - run: pnpm --filter @ninefold/web test
      - run: pnpm --filter @ninefold/web build
      - run: pnpm --filter @ninefold/web budget

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@7a445ee88d4e23b52c33b00306c5c45680cda8f6 # v5
        with:
          distribution: temurin
          java-version: '25'
      - run: make tla

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/server/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ninefold/web exec playwright install --with-deps chromium
      - run: make e2e

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/server/go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
        working-directory: apps/server
      - run: pnpm audit --audit-level high
      - run: docker build -f apps/server/Dockerfile --build-arg VERSION=${{ github.sha }} -t ninefold-server:test .
      - run: docker build -f apps/web/Dockerfile --build-arg VERSION=${{ github.sha }} -t ninefold-web:test .
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image --exit-code 1 --severity HIGH,CRITICAL ninefold-server:test
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image --exit-code 1 --severity HIGH,CRITICAL ninefold-web:test
