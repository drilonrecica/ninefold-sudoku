openapi: 3.1.0
info:
  title: Ninefold Sudoku HTTP API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Process is live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Database is migrated and ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /rooms:
    post:
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /rooms/{code}:
    get:
      operationId: previewRoom
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: '^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$'
      responses:
        '200':
          description: Room preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomPreviewResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /rooms/{code}/join:
    post:
      operationId: joinRoom
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: '^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRoomRequest'
      responses:
        '200':
          description: Joined room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /rooms/{code}/resume:
    post:
      operationId: resumeRoom
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: '^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$'
      responses:
        '200':
          description: Resumed session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /rooms/{code}/leave:
    post:
      operationId: leaveRoom
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: '^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRoomRequest'
      responses:
        '204':
          description: Left room
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /replays/{matchId}/capabilities:
    post:
      operationId: createReplayCapability
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '201':
          description: Replay read capability created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayCapabilityResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /replays/{replayId}:
    get:
      operationId: getReplay
      parameters:
        - name: replayId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      security:
        - replayCapability: []
      responses:
        '200':
          description: Immutable public replay projection
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteReplay
      parameters:
        - name: replayId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '204':
          description: Replay access deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /solo/puzzles:
    post:
      operationId: createSoloAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoloAssignmentRequest'
      responses:
        '201':
          description: Stateless signed Solo assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoloAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /solo/attempts/{attemptId}/hint:
    post:
      operationId: requestSoloHint
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoloHintRequest'
      responses:
        '200':
          description: Deterministic Nudge or Reveal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoloHintResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /solo/attempts/{attemptId}/complete:
    post:
      operationId: validateSoloCompletion
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoloBoardRequest'
      responses:
        '200':
          description: Authoritative completion validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoloCompletionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
components:
  securitySchemes:
    replayCapability:
      type: http
      scheme: bearer
  schemas:
    UUIDv7:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    SafeInteger:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    Liveness:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          const: live
        version:
          type: string
          minLength: 1
          maxLength: 128
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        reason:
          type: string
        version:
          type: string
          minLength: 1
          maxLength: 128
    SoloPlayStyle:
      type: string
      enum: [Guided, Classic]
    SoloDifficulty:
      type: string
      enum: [Easy, Medium, Hard, Expert, Random]
    SoloAssignmentRequest:
      type: object
      additionalProperties: false
      required: [difficulty, playStyle, recentPuzzleIds]
      properties:
        difficulty:
          $ref: '#/components/schemas/SoloDifficulty'
        playStyle:
          $ref: '#/components/schemas/SoloPlayStyle'
        recentPuzzleIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UUIDv7'
    SoloAssignmentResponse:
      type: object
      additionalProperties: false
      required:
        [
          attemptId,
          assignmentProof,
          clues,
          puzzleId,
          revision,
          difficulty,
          generatorVersion,
          solverVersion,
          transformationVersion,
          transformationSeed,
          issuedAtMs,
        ]
      properties:
        attemptId:
          $ref: '#/components/schemas/UUIDv7'
        assignmentProof:
          type: string
          minLength: 64
          maxLength: 2048
        clues:
          type: string
          pattern: '^[0-9]{81}$'
        puzzleId:
          $ref: '#/components/schemas/UUIDv7'
        revision:
          type: integer
          minimum: 1
        difficulty:
          type: string
          enum: [Easy, Medium, Hard, Expert]
        generatorVersion:
          type: string
        solverVersion:
          type: string
        transformationVersion:
          type: string
        transformationSeed:
          $ref: '#/components/schemas/SafeInteger'
        issuedAtMs:
          $ref: '#/components/schemas/SafeInteger'
    SoloBoardRequest:
      type: object
      additionalProperties: false
      required: [assignmentProof, values]
      properties:
        assignmentProof:
          type: string
          minLength: 64
          maxLength: 2048
        values:
          type: string
          pattern: '^[0-9]{81}$'
    SoloHintRequest:
      type: object
      additionalProperties: false
      required: [assignmentProof, values, level]
      properties:
        assignmentProof:
          type: string
          minLength: 64
          maxLength: 2048
        values:
          type: string
          pattern: '^[0-9]{81}$'
        level:
          type: string
          enum: [Nudge, Reveal]
    SoloHintResponse:
      type: object
      additionalProperties: false
      required: [level, penaltyMs]
      properties:
        level:
          type: string
          enum: [Nudge, Reveal]
        penaltyMs:
          type: integer
          const: 20000
        technique:
          type: string
        unitKind:
          type: string
        unitIndex:
          type: integer
          minimum: 0
        affectedCells:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 80
        cell:
          type: integer
          minimum: 0
          maximum: 80
        value:
          type: integer
          minimum: 1
          maximum: 9
    SoloCompletionResponse:
      type: object
      additionalProperties: false
      required: [complete]
      properties:
        complete:
          type: boolean
        incorrectCells:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 80
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [requestId, version, data]
      properties:
        requestId:
          $ref: '#/components/schemas/UUIDv7'
        version:
          $ref: '#/components/schemas/SafeInteger'
        data:
          type: object
          additionalProperties: false
          required: [displayName]
          properties:
            displayName:
              type: string
              minLength: 1
              maxLength: 128
    RoomMode:
      type: string
      enum: [Coop]
    RoomDifficulty:
      type: string
      enum: [Easy, Medium, Hard, Expert]
    RoomErrorPreset:
      type: string
      enum: [Casual, Challenge, Blind, Clean]
    RoomRole:
      type: string
      enum: [Player, Spectator]
    RoomState:
      type: string
      enum: [Lobby, Countdown, InMatch, Results]
    RoomSettings:
      type: object
      additionalProperties: false
      required:
        [
          mode,
          difficulty,
          errorPreset,
          hintsEnabled,
          sharedNotes,
          autoRemoveNotes,
          spectatorsAllowed,
        ]
      properties:
        mode:
          $ref: '#/components/schemas/RoomMode'
        difficulty:
          $ref: '#/components/schemas/RoomDifficulty'
        errorPreset:
          $ref: '#/components/schemas/RoomErrorPreset'
        hintsEnabled:
          type: boolean
        sharedNotes:
          type: boolean
        autoRemoveNotes:
          type: boolean
        spectatorsAllowed:
          type: boolean
    RoomParticipant:
      type: object
      additionalProperties: false
      required: [id, name, role, isHost, isReady, joinedAt]
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        name:
          type: string
          minLength: 1
          maxLength: 128
        role:
          $ref: '#/components/schemas/RoomRole'
        isHost:
          type: boolean
        isReady:
          type: boolean
        joinedAt:
          $ref: '#/components/schemas/SafeInteger'
    Room:
      type: object
      additionalProperties: false
      required:
        [id, code, state, version, settings, hostId, currentMatchId, rematchNumber, participants]
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        code:
          type: string
          pattern: '^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$'
        state:
          $ref: '#/components/schemas/RoomState'
        version:
          $ref: '#/components/schemas/SafeInteger'
        settings:
          $ref: '#/components/schemas/RoomSettings'
        hostId:
          oneOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
        currentMatchId:
          oneOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
        rematchNumber:
          $ref: '#/components/schemas/SafeInteger'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/RoomParticipant'
    Countdown:
      type: object
      additionalProperties: false
      required: [matchId, generation, deadlineAt]
      properties:
        matchId:
          $ref: '#/components/schemas/UUIDv7'
        generation:
          $ref: '#/components/schemas/SafeInteger'
        deadlineAt:
          $ref: '#/components/schemas/SafeInteger'
    RoomResponse:
      type: object
      additionalProperties: false
      required: [room, participants, self]
      properties:
        room:
          $ref: '#/components/schemas/Room'
        countdown:
          oneOf:
            - $ref: '#/components/schemas/Countdown'
            - type: 'null'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/RoomParticipant'
        self:
          type: object
          additionalProperties: false
          required: [participantId]
          properties:
            participantId:
              $ref: '#/components/schemas/UUIDv7'
    RoomPreviewResponse:
      type: object
      additionalProperties: false
      required:
        [
          mode,
          difficulty,
          state,
          locked,
          playerSeatsTotal,
          playerSeatsAvailable,
          spectatorSeatsTotal,
          spectatorSeatsAvailable,
        ]
      properties:
        mode:
          $ref: '#/components/schemas/RoomMode'
        difficulty:
          $ref: '#/components/schemas/RoomDifficulty'
        state:
          $ref: '#/components/schemas/RoomState'
        locked:
          type: boolean
        playerSeatsTotal:
          type: integer
          minimum: 1
          maximum: 8
        playerSeatsAvailable:
          type: integer
          minimum: 0
          maximum: 8
        spectatorSeatsTotal:
          type: integer
          minimum: 0
          maximum: 20
        spectatorSeatsAvailable:
          type: integer
          minimum: 0
          maximum: 20
    CreateRoomRequest:
      type: object
      additionalProperties: false
      required: [displayName, mode, difficulty]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        mode:
          $ref: '#/components/schemas/RoomMode'
        difficulty:
          $ref: '#/components/schemas/RoomDifficulty'
    JoinRoomRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        role:
          $ref: '#/components/schemas/RoomRole'
    LeaveRoomRequest:
      type: object
      additionalProperties: false
      properties:
        intent:
          type: string
          enum: [leave_lobby, become_spectator]
    ReplayCapabilityResponse:
      type: object
      additionalProperties: false
      required: [replayId, capability, shareUrl, expiresAt]
      properties:
        replayId:
          $ref: '#/components/schemas/UUIDv7'
        capability:
          type: string
          minLength: 43
          maxLength: 43
        shareUrl:
          type: string
          minLength: 1
          maxLength: 512
        expiresAt:
          $ref: '#/components/schemas/SafeInteger'
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, messageKey, requestId, details]
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]{1,63}$'
            messageKey:
              type: string
              pattern: "^error\\.[a-z0-9_]+$"
            requestId:
              type: string
              maxLength: 36
            retryable:
              type: boolean
            details:
              type: object
              propertyNames:
                pattern: '^(?!.*(?:[Tt]oken|[Ss]ecret|[Cc]ookie|[Cc]redential|[Cc]apability|[Ss]olution)).+$'
              additionalProperties:
                oneOf:
                  - type: string
                  - type: boolean
                  - type: integer
                    format: int64
                    minimum: 0
                    maximum: 9007199254740991
                  - type: 'null'
  responses:
    BadRequest:
      description: Invalid request shape
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Invalid or missing session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Room or resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: State conflict or active session exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: Domain validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
